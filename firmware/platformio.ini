[platformio]
src_dir = esp32_marauder
test_dir = test

; Device build for the custom PocketMarauder board (ESP32-WROOM-32D + SSD1306
; OLED + 4 buttons). Board target is selected by `#define POCKET_MARAUDER` in
; esp32_marauder/configs.h, so no board-select build flag is needed here.
; Requires the Arduino-ESP32 3.x / IDF 5.x core (HAS_IDF_3, HAS_NIMBLE_2), so
; the pioarduino platform fork is used instead of the stock espressif32 (frozen
; on core 2.x).
[env:pocket_marauder]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_ldf_mode = deep+
lib_extra_dirs =
  esp32_marauder/libraries
  libraries
extra_scripts =
  pre:tools/pio_framework_libs.py
build_flags =
  -DCORE_DEBUG_LEVEL=0
  ; pioarduino promotes -Werror=return-type; upstream Marauder sketch has
  ; functions with implicit returns. Demote to a warning to build unmodified.
  -Wno-error=return-type
  ; upstream defines several globals (index_html, connectionPending, ...) in
  ; headers included by multiple TUs, and intentionally overrides the SDK weak
  ; symbol ieee80211_raw_frame_sanity_check. Both are ODR clashes the GNU ld
  ; default rejects; let the linker keep the first (sketch) definition.
  -Wl,--allow-multiple-definition
; libraries/ lives under src_dir; the src builder would otherwise recurse into
; its examples/ and extras/ dirs. Compile them only via lib_extra_dirs (LDF).
build_src_filter = +<*> -<libraries/>

[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = true
extra_scripts =
  pre:tools/native_coverage.py
build_src_filter =
  -<*>
  +<MarauderMacAddress.cpp>
  +<PcapHeader.cpp>
  +<Switches.cpp>
  +<DisplayLine.cpp>
  +<BeaconFrame.cpp>
  +<WdgResponse.cpp>
  +<FoxHuntTarget.cpp>
  +<TargetListSort.cpp>
  +<TDongleStats.cpp>
  +<IPv4Range.cpp>
  +<FirmwareMetadata.cpp>
  +<MenuMarquee.cpp>
  +<GpsTrackerStats.cpp>
  +<BootSplash.cpp>
  +<MenuInputRepeat.cpp>
  +<TDongleBus.cpp>
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Wpedantic
  --coverage
  -Itest/support
